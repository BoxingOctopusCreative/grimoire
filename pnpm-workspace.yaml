packages:
  - .

# pnpm 12+: approve packages that need install-time build scripts.
# See https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  core-js: true
  es5-ext: true
  esbuild: true

# Force patched xmldom (epubjs still pins ^0.7.5; Dependabot high alerts).
overrides:
  "@xmldom/xmldom": "0.8.15"
