name: CI and Release

# Tests run on every pull request update.
# On merge (or manual dispatch), tests must pass, then we bump the version,
# create a tag + draft GitHub release, attach production builds, then publish
# (draft-first so immutable releases can still receive assets).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  CI: true

jobs:
  test:
    name: Test
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Wayland, xkbcommon, and fontconfig are what the GPUI window links.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app -> target'

      - name: Rust tests
        run: cargo test --manifest-path app/Cargo.toml

  version-and-release:
    name: Tag and release
    needs: test
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      # Admin PAT bypasses "require PR" on main (GITHUB_TOKEN cannot).
      # Repo secret: RELEASE_GITHUB_TOKEN (classic repo scope, or fine-grained Contents R/W).
      - name: Require release token
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [[ -z "${RELEASE_GITHUB_TOKEN}" ]]; then
            echo "Missing secret RELEASE_GITHUB_TOKEN." >&2
            echo "Create a PAT for a repo admin (classic: repo scope, or fine-grained: Contents Read/Write)," >&2
            echo "then add it as Settings → Secrets and variables → Actions → RELEASE_GITHUB_TOKEN." >&2
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || github.event.pull_request.title }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/bump-version.sh .github/scripts/release-notes.sh

          PREV_TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          # Capture previous tag before creating the new one for release notes.
          # Assign first so a non-zero exit from bump-version.sh fails this step.
          BUMP_OUT="$(.github/scripts/bump-version.sh "$BUMP_SOURCE")"
          eval "${BUMP_OUT}"

          if [[ -z "${VERSION:-}" || -z "${TAG:-}" ]]; then
            echo "bump-version.sh did not produce VERSION/TAG" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${PREVIOUS} -> ${VERSION} (${BUMP}) from: ${BUMP_SOURCE}"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" || -z "${TAG}" ]]; then
            echo "Missing VERSION or TAG from bump step" >&2
            exit 1
          fi
          git add app/Cargo.toml app/Cargo.lock
          git commit -m "chore: release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "HEAD:${BASE_REF}"
          git push origin "${TAG}"

      - name: Generate release notes from commits
        id: notes
        env:
          PREV_TAG: ${{ steps.bump.outputs.prev_tag }}
          TAG: ${{ steps.bump.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_LABEL: ${{ github.event_name == 'workflow_dispatch' && format('Manual dispatch ({0})', inputs.bump) || github.event.pull_request.title }}
          SOURCE_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          {
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              echo "Merged PR: [${SOURCE_LABEL}](${SOURCE_URL})"
            else
              echo "Manual release: [${SOURCE_LABEL}](${SOURCE_URL})"
            fi
            echo
            echo "Version bump: **${BUMP}**"
            echo
            # Always pass PREV_TAG (may be empty on the first release).
            .github/scripts/release-notes.sh "${PREV_TAG}"
          } > "${NOTES_FILE}"
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          # Draft first so assets can upload before immutable publish locks the release.
          URL="$(gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --draft \
            --verify-tag)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          ID="$(gh release view "${TAG}" --json databaseId --jq .databaseId)"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "Created draft release ${TAG} (${URL})"

  build:
    name: Production build (${{ matrix.label }})
    needs: version-and-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS arm64
            cargo_args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            archive_suffix: macos_arm64
          - platform: macos-latest
            label: macOS x64
            cargo_args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            archive_suffix: macos_x64
          - platform: ubuntu-22.04
            label: Linux x64
            cargo_args: ''
            rust_targets: ''
            archive_suffix: linux_x64
          - platform: windows-latest
            label: Windows x64
            cargo_args: ''
            rust_targets: ''
            archive_suffix: windows_x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-release.outputs.tag }}

      # Wayland, xkbcommon, and fontconfig are what the GPUI window links.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app -> target'

      # Developer ID cert + App Store Connect API key for signing and notarization.
      # APPLE_SIGNING_IDENTITY is optional: when omitted, the package script uses the identity inside APPLE_CERTIFICATE.
      - name: Prepare Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENTS
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing Apple signing secrets: ${missing[*]}" >&2
            echo "Add them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENTS" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          echo "Wrote App Store Connect API key to ${KEY_PATH}"

      - name: Build release binary
        run: cargo build --manifest-path app/Cargo.toml --release --bin Grimoire ${{ matrix.cargo_args }}

      - name: Package macOS disk image
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/package-macos.sh
          .github/scripts/package-macos.sh \
            "app/target/${{ matrix.rust_targets }}/release/Grimoire" \
            dist \
            "${{ matrix.archive_suffix }}"

      - name: Package Linux binary
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-and-release.outputs.version }}"
          mkdir -p dist
          tar -C app/target/release -czf "dist/Grimoire_${VERSION}_${{ matrix.archive_suffix }}.tar.gz" Grimoire

      - name: Package Windows binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-and-release.outputs.version }}"
          mkdir -p dist
          tar -a -C app/target/release -cf "dist/Grimoire_${VERSION}_${{ matrix.archive_suffix }}.zip" Grimoire.exe

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version-and-release.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=()
          while IFS= read -r asset; do
            ASSETS+=("$asset")
          done < <(find dist -type f | sort -u)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No release artifacts found to upload" >&2
            exit 1
          fi
          printf 'Uploading:\n'
          printf '  %s\n' "${ASSETS[@]}"
          gh release upload "${TAG}" "${ASSETS[@]}" --clobber

  publish-release:
    name: Publish release
    needs: [version-and-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version-and-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false
          echo "Published immutable release ${TAG}"
          gh release view "${TAG}" --json url,isDraft,isImmutable,assets --jq '{url,isDraft,isImmutable,asset_count:(.assets|length),assets:[.assets[].name]}'