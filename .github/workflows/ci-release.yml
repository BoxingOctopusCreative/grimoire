name: CI and Release

# Tests run on every pull request update.
# On merge (or manual dispatch), tests must pass, then we bump the version,
# create a tag + draft GitHub release, attach production builds, then publish
# (draft-first so immutable releases can still receive assets).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  CI: true

jobs:
  test:
    name: Test
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  version-and-release:
    name: Tag and release
    needs: test
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      # Admin PAT bypasses "require PR" on main (GITHUB_TOKEN cannot).
      # Repo secret: RELEASE_GITHUB_TOKEN (classic repo scope, or fine-grained Contents R/W).
      - name: Require release token
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [[ -z "${RELEASE_GITHUB_TOKEN}" ]]; then
            echo "Missing secret RELEASE_GITHUB_TOKEN." >&2
            echo "Create a PAT for a repo admin (classic: repo scope, or fine-grained: Contents Read/Write)," >&2
            echo "then add it as Settings → Secrets and variables → Actions → RELEASE_GITHUB_TOKEN." >&2
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || github.event.pull_request.title }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/bump-version.sh .github/scripts/release-notes.sh

          PREV_TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          # Capture previous tag before creating the new one for release notes.
          # Assign first so a non-zero exit from bump-version.sh fails this step.
          BUMP_OUT="$(.github/scripts/bump-version.sh "$BUMP_SOURCE")"
          eval "${BUMP_OUT}"

          if [[ -z "${VERSION:-}" || -z "${TAG:-}" ]]; then
            echo "bump-version.sh did not produce VERSION/TAG" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${PREVIOUS} -> ${VERSION} (${BUMP}) from: ${BUMP_SOURCE}"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" || -z "${TAG}" ]]; then
            echo "Missing VERSION or TAG from bump step" >&2
            exit 1
          fi
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "HEAD:${BASE_REF}"
          git push origin "${TAG}"

      - name: Generate release notes from commits
        id: notes
        env:
          PREV_TAG: ${{ steps.bump.outputs.prev_tag }}
          TAG: ${{ steps.bump.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_LABEL: ${{ github.event_name == 'workflow_dispatch' && format('Manual dispatch ({0})', inputs.bump) || github.event.pull_request.title }}
          SOURCE_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          {
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              echo "Merged PR: [${SOURCE_LABEL}](${SOURCE_URL})"
            else
              echo "Manual release: [${SOURCE_LABEL}](${SOURCE_URL})"
            fi
            echo
            echo "Version bump: **${BUMP}**"
            echo
            # Always pass PREV_TAG (may be empty on the first release).
            .github/scripts/release-notes.sh "${PREV_TAG}"
          } > "${NOTES_FILE}"
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          # Draft first so assets can upload before immutable publish locks the release.
          URL="$(gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --draft \
            --verify-tag)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          ID="$(gh release view "${TAG}" --json databaseId --jq .databaseId)"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "Created draft release ${TAG} (${URL})"

  build:
    name: Production build (${{ matrix.label }})
    needs: version-and-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS arm64
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            label: macOS x64
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
            rust_targets: ''
          - platform: windows-latest
            label: Windows x64
            args: --bundles nsis,msi
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-release.outputs.tag }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to draft release
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version-and-release.outputs.tag }}
          releaseId: ${{ needs.version-and-release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # macOS: build first, inject Gatekeeper installer into the DMG, then upload.
      - name: Build macOS bundles
        id: build_mac
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Add Gatekeeper installer to macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          chmod +x .github/scripts/inject-macos-dmg-installer.sh \
            "src-tauri/macos/Install Grimoire.command"
          .github/scripts/inject-macos-dmg-installer.sh

      - name: Upload macOS release assets
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version-and-release.outputs.tag }}
        run: |
          set -euo pipefail
          # bash 3.2 on macOS has no mapfile; use a while-read loop instead.
          ASSETS=()
          while IFS= read -r asset; do
            ASSETS+=("$asset")
          done < <(find src-tauri/target -type f \( \
            -path '*/bundle/dmg/*.dmg' -o \
            -path '*/bundle/macos/*.tar.gz' \
          \) ! -name 'rw.*.dmg' | sort -u)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No macOS bundle artifacts found to upload" >&2
            exit 1
          fi
          printf 'Uploading:\n'
          printf '  %s\n' "${ASSETS[@]}"
          gh release upload "${TAG}" "${ASSETS[@]}" --clobber

  publish-release:
    name: Publish release
    needs: [version-and-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version-and-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false
          echo "Published immutable release ${TAG}"
          gh release view "${TAG}" --json url,isDraft,isImmutable,assets --jq '{url,isDraft,isImmutable,asset_count:(.assets|length),assets:[.assets[].name]}'